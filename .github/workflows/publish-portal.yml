# Publie une nouvelle version du portail web (page de telechargement + aide en ligne) sans reconstruire
# l'application : l'installeur, l'executable et le latest.json signe sont repris de la derniere release GitHub.
#
# Declenchement : modification du portail sur main (modele de page, aide, charte) ou manuel (onglet Actions).
# Secret : AZURE_STATIC_WEB_APPS_API_TOKEN.
name: Publier le portail

on:
  push:
    branches: [main]
    paths:
      - 'tools/site-template/**'
      - 'tools/build-docs.py'
      - 'tools/build-site.py'
      - 'assets/openpub-design/**'
      - '.github/workflows/publish-portal.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Essai : construire sans publier'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: portail-openpub
  cancel-in-progress: false

jobs:
  build:
    name: Construire le portail (Windows)
    runs-on: windows-latest
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mode
        id: mode
        shell: pwsh
        env:
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          $dry = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_DRY } else { 'false' }
          "dry_run=$dry" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Dernière version publiée de l'application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo $env:GITHUB_REPOSITORY --dir release --pattern 'OpenPub-*.msi' --pattern 'OpenPub.exe' --pattern 'latest.json'
          if ($LASTEXITCODE -ne 0) { throw "Aucune release de l'application : publiez d'abord une version (pipeline « Publier une version de l'app »)." }
          Get-ChildItem release | Format-Table Name, Length

      - name: Portail (page de téléchargement + aide en ligne)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem release/OpenPub-*.msi | Select-Object -First 1).FullName
          python tools/build-site.py --out work/site --exe release/OpenPub.exe --msi $msi --manifest release/latest.json
          if ($LASTEXITCODE -ne 0) { throw "Échec de la construction du portail" }

      - uses: actions/upload-artifact@v4
        with:
          name: portail
          path: work/site
          retention-days: 14

  publish:
    name: Publier sur Azure
    needs: build
    if: needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: portail
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portail
          path: site

      - name: Envoi sur Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          output_location: ''
          skip_app_build: true
          skip_api_build: true
